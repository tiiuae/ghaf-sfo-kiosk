# SPDX-FileCopyrightText: 2026 TII (SSRC) and the Ghaf contributors
# SPDX-License-Identifier: Apache-2.0
#
# Annotate ONLY files that structurally cannot carry an SPDX comment header.
# Every path listed here is a path that silently stops being checked, so the list
# is kept as short as the format allows. Anything that takes a `#` or `//`
# comment gets a real header instead.

version = 1
SPDX-PackageName = "ghaf-sfo-kiosk"
SPDX-PackageSupplier = "Technology Innovation Institute <https://tii.ae>"
SPDX-PackageDownloadLocation = "https://github.com/tiiuae/ghaf-sfo-kiosk"

[[annotations]]
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2026 TII (SSRC) and the Ghaf contributors"
precedence = "closest"
path = [
  # JSON has no comment syntax.
  "flake.lock",
  "Cargo.lock",
  "examples/*.json",
]
