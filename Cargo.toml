[package]
name = "ghaf-sfo-kiosk"
version = "0.1.0"
edition = "2021"
# The floor the dependency tree imposes, not the toolchain we happen to build
# with: the gtk4 0.11 stack declares 1.92, and nothing in the locked graph
# declares more. `cargo upgrade` filters candidate releases by this field, so
# letting it go stale silently caps every dependency -- see nix/update-deps.nix.
rust-version = "1.92"
license = "Apache-2.0"
description = "A config-driven kiosk shell for Ghaf-based SFO laptops"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Not unused despite nothing in src/ naming it directly:
# generate_interfaces! (see src/protocols.rs) emits absolute
# wayland_backend::protocol::wl_interface paths.
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging", "client"] }
wayland-scanner = "0.31"

[[bin]]
name = "ghaf-sfo-kiosk"
path = "src/main.rs"

[profile.release]
# A kiosk is one small binary on a microVM's read-only store image; trading
# compile time for size is the right way round here.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
