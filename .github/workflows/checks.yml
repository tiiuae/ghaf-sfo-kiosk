#
# The PR gate. Everything is a flake check, so this file stays three nix calls:
# `nix flake check` builds the package, runs `cargo test` via buildRustPackage's
# checkPhase, clippy, and treefmt over every language in the tree.

name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}.${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://ghaf-dev.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = ghaf-dev.cachix.org-1:S3M8x3no8LFQPBfHw1jl6nmP8A7cVWKntoMKN3IsEQY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # Cheapest first: a missing licence header is a ten-second fix.
      - name: Licence headers
        run: nix run nixpkgs#reuse -- lint

      - name: Flake outputs are well-formed
        run: nix flake show --all-systems

      - name: Build, test, clippy and formatting
        run: nix flake check --all-systems --keep-going -L
